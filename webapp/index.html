<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TirfMarket Mini-App</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none antialiased">

  <!-- Mobile Card Container -->
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 relative overflow-hidden">
    
    <!-- Ambient Glow Effect -->
    <div class="absolute -top-16 -right-16 w-36 h-36 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <!-- 1. Header -->
    <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-base shadow-md">
          🍔
        </div>
        <h1 class="text-sm font-bold text-white tracking-tight">TirfMarket Mini-App</h1>
      </div>
      <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/15 text-sky-400 border border-sky-500/30">
        <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
        AAU RADAR
      </span>
    </div>

    <!-- 2. Hero Section -->
    <div class="space-y-3">
      <div class="relative rounded-2xl overflow-hidden bg-slate-800/80 border border-slate-700/60 aspect-video flex items-center justify-center">
        <img 
          id="deal-image"
          src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80" 
          alt="Angla Cheese Burger" 
          class="w-full h-full object-cover"
        />
        <div class="absolute top-2 right-2 bg-red-600/90 text-white font-black text-[11px] px-2.5 py-0.5 rounded-full shadow-md backdrop-blur-xs">
          37% OFF
        </div>
        <div class="absolute bottom-2 left-2 bg-slate-950/80 text-slate-300 font-medium text-[10px] px-2 py-0.5 rounded-md backdrop-blur-xs flex items-center gap-1">
          📍 <span id="deal-location">4 Kilo Branch</span>
        </div>
      </div>

      <div>
        <h2 id="hero-title" class="text-lg font-bold text-white leading-snug">
          Angla Cheese Burger - 37% OFF DEAL
        </h2>
        <p class="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
          <span>⏰ Valid Until 9:30 PM Tonight</span>
          <span>•</span>
          <span class="text-amber-400 font-semibold" id="stock-tag">⚠️ Limited Stock</span>
        </p>
      </div>
    </div>

    <!-- 3. Dynamic Price Box -->
    <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
      <div>
        <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold block">Exclusive Student Price</span>
        <div class="flex items-baseline gap-2 mt-0.5">
          <span id="deal-price" class="text-2xl font-black text-emerald-400 tracking-tight">360 ETB</span>
          <span id="original-price" class="text-xs font-semibold text-slate-500 line-through">Was 575 ETB</span>
        </div>
      </div>
      <div class="text-right">
        <span class="inline-block bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2 py-1 rounded-lg">
          SAVE 215 ETB
        </span>
      </div>
    </div>

    <!-- 4. Action Section -->
    <div class="space-y-3 pt-1">
      <!-- Primary Big Blue Action Button -->
      <button
        id="claim-btn"
        onclick="handleClaimClick()"
        class="w-full py-4 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold rounded-2xl shadow-lg shadow-sky-600/30 transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer text-base active:scale-[0.98]"
      >
        <span>⚡</span>
        <span id="btn-label">Lock Deal & Get Code</span>
      </button>

      <!-- 5. Footer Text -->
      <p class="text-center text-[11px] text-slate-400 font-medium leading-relaxed">
        Pay at the counter when you arrive.
      </p>
    </div>

  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.enableClosingConfirmation) {
        tg.enableClosingConfirmation();
      }
    }

    // Parse dynamic parameters from URL search query
    const urlParams = new URLSearchParams(window.location.search);
    const dealId = urlParams.get('deal_id') || 'angla_1';
    const restaurant = urlParams.get('restaurant') || 'Angla Burger';
    const item = urlParams.get('item') || 'Angla Cheese Burger';
    const price = urlParams.get('price') || '360';
    const originalPrice = urlParams.get('original') || '575';
    const zone = urlParams.get('zone') || '4 Kilo Branch';

    // Populate dynamic elements
    if (document.getElementById('hero-title')) {
      document.getElementById('hero-title').innerText = `${item} - 37% OFF DEAL`;
    }
    if (document.getElementById('deal-price')) {
      document.getElementById('deal-price').innerText = `${price} ETB`;
    }
    if (document.getElementById('original-price')) {
      document.getElementById('original-price').innerText = `Was ${originalPrice} ETB`;
    }
    if (document.getElementById('deal-location')) {
      document.getElementById('deal-location').innerText = zone;
    }

    let isClaiming = false;

    function handleClaimClick() {
      if (isClaiming) return;
      isClaiming = true;

      const btn = document.getElementById('claim-btn');
      const btnLabel = document.getElementById('btn-label');
      if (btnLabel) btnLabel.innerText = "Locking Deal...";
      btn.classList.add('opacity-80', 'pointer-events-none');

      // 1. Prepare JSON Payload
      const payload = {
        action: "claim_deal",
        deal_id: dealId,
        timestamp: Date.now()
      };

      // 2. Telegram WebApp Bridge: sendData & close
      if (tg && typeof tg.sendData === 'function') {
        try {
          tg.sendData(JSON.stringify(payload));
          setTimeout(() => {
            tg.close();
          }, 150);
          return;
        } catch (err) {
          console.error("tg.sendData error:", err);
        }
      }

      // Fallback for desktop browser preview outside Telegram iframe
      alert(`[TMA Simulation] Payload sent to Telegram Bot:\n${JSON.stringify(payload, null, 2)}\n\nClosing Mini App window.`);
      isClaiming = false;
      if (btnLabel) btnLabel.innerText = "Lock Deal & Get Code";
      btn.classList.remove('opacity-80', 'pointer-events-none');
    }
  </script>
</body>
</html>
